services:
  - type: web
    name: smart-attendance
    env: python
    plan: starter  # Use starter plan for more memory during build
    buildCommand: "./build.sh"
    startCommand: "gunicorn app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: UV_SYSTEM_PYTHON
        value: "1"
